<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6623">
<title>You're offline · Ram Avatar Fresh Basket</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fcfbf7; color: #13231a;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e2e9dd; border-radius: 20px; padding: 32px 24px;
         box-shadow: 0 18px 40px -18px rgba(11,102,35,.25); }
  img { width: 96px; height: 96px; border-radius: 24px; }
  h1 { color: #0b6623; font-size: 1.5rem; margin: 18px 0 8px; }
  p { color: #3a4b40; line-height: 1.55; margin: 0 0 8px; }
  button { margin-top: 18px; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #0b6623; color: #fff;
           font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #a7d769; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Ram Avatar Fresh Basket">
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Your cart is saved on this device.</p>
  <p>Ordering and live prices need an internet connection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
